substitutions:
  device_name: monitoring-fahmi-plts
  friendly_name: "Monitoring Fahmi PLTS"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100.0
    then:
      - delay: 15s
      - script.execute: sync_time_to_mppt

# ── ESP32 CONFIGURATION ─────────────────────────────────────────────────────
esp32:
  board: esp32doit-devkit-v1

logger:
  hardware_uart: UART0
  baud_rate: 0
  logs:
    uart: WARN

api:
  services:
    - service: sync_time
      then:
        - script.execute: sync_time_to_mppt

    - service: motor_maju_manual
      then:
        - switch.turn_on: relay_maju
        - switch.turn_off: relay_mundur

    - service: motor_mundur_manual
      then:
        - switch.turn_on: relay_mundur
        - switch.turn_off: relay_maju

    - service: motor_stop
      then:
        - switch.turn_off: relay_maju
        - switch.turn_off: relay_mundur

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Monitoring-Fahmi-PLTS"
    password: !secret fallback_ap_password

captive_portal:

# ── UART CONFIGURATION ────────────────────────────────────────────────────────
uart:
  - id: mppt_uart
    tx_pin: GPIO27
    rx_pin: GPIO26
    baud_rate: 2400
    data_bits: 8
    parity: NONE
    stop_bits: 1

  - id: pzem_uart
    tx_pin: GPIO33
    rx_pin: GPIO32
    baud_rate: 9600
    stop_bits: 1

  - id: huawei_uart
    tx_pin: GPIO14
    rx_pin: GPIO13
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

# ── MODBUS ───────────────────────────────────────────────────────────────────
modbus:
  - id: pzem_modbus
    uart_id: pzem_uart

  # Modbus khusus untuk Huawei agar diatur oleh ESPHome secara otomatis (Non-blocking)
  - id: huawei_modbus
    uart_id: huawei_uart

modbus_controller:
  - id: huawei_controller
    modbus_id: huawei_modbus
    address: 214
    update_interval: 5s

# ── TIME ─────────────────────────────────────────────────────────────────────
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Jakarta"
    servers:
      - pool.ntp.org
      - time.nist.gov
    on_time:
      - hours: 0
        minutes: 1
        seconds: 0
        then:
          - script.execute: sync_time_to_mppt

      - hours: 23
        minutes: 59
        seconds: 50
        then:
          - sensor.template.publish:
              id: sensor_ac_daily_kwh
              state: 0.0
          - lambda: |-
              float current_daily = id(sensor_daily_kwh).state;
              if (!isnan(current_daily)) {
                id(kwh_4hari) = id(kwh_3hari);
                id(kwh_3hari) = id(kwh_2hari);
                id(kwh_2hari) = id(kwh_kemarin);
                id(kwh_kemarin) = current_daily;
              }
              id(watt_max) = 0.0;
              id(sun_hour) = 0.0;
              ESP_LOGI("DAILY_RESET", "Rotasi riwayat kWh & reset watt_max berhasil dijalankan!");

      - seconds: 0
        minutes: 0
        hours: 18
        then:
          - globals.set:
              id: lcd_aktif
              value: "false"

      - seconds: 0
        minutes: 15
        hours: 5
        then:
          - globals.set:
              id: lcd_aktif
              value: "true"

      - seconds: 0
        minutes: 50
        hours: 17
        then:
          - if:
              condition:
                lambda: "return !id(sudah_balik);"
              then:
                - script.execute: script_balik_timur_5min

      - seconds: 0
        minutes: 0
        hours: 9
        then:
          - globals.set:
              id: sudah_balik
              value: "false"
          - logger.log: "Flag tracker di-reset"

      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - logger.log: "Melakukan Restart Terjadwal (03:00)"
          - button.press: btn_restart_esp

i2c:
  sda: GPIO23
  scl: GPIO22
  scan: true
  id: bus_i2c

# ── SCRIPT ───────────────────────────────────────────────────────────────────
script:
  - id: animation_strobe_wifi
    mode: restart
    then:
      - light.turn_on: led_status
      - delay: 200ms
      - light.turn_off: led_status
      - delay: 800ms

  - id: animation_fast_blink
    mode: restart
    then:
      - light.turn_on: led_status
      - delay: 200ms
      - light.turn_off: led_status

  - id: sync_time_to_mppt
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || now.year < 2022) {
            ESP_LOGW("MPPT_SYNC", "NTP belum sinkron, sync dibatalkan!");
            return;
          }

          uint16_t year   = now.year;
          uint8_t  month  = now.month;
          uint8_t  day    = now.day_of_month;
          uint8_t  hour   = now.hour;
          uint8_t  minute = now.minute;
          uint8_t  second = now.second;

          uint8_t sync_cmd[18] = {
            0x43, 0x54, 0x49, 0x4D, 0x0D,
            0x52, 0x45, 0x54, 0x49, 0x4D, 0x45,
            (uint8_t)(year >> 8),
            (uint8_t)(year & 0xFF),
            month, day, hour, minute, second
          };

          uint8_t flush_byte;
          while (id(mppt_uart).available()) id(mppt_uart).read_byte(&flush_byte);

          id(de_re_pin).turn_on();
          delay(1);
          id(mppt_uart).write_array(sync_cmd, sizeof(sync_cmd));
          id(mppt_uart).flush();
          id(de_re_pin).turn_off();

          ESP_LOGI("MPPT_SYNC", "Waktu berhasil dikirim ke MPPT");

  - id: script_balik_timur_5min
    mode: restart
    then:
      - logger.log: "Balik ke Timur - 5min"
      - switch.turn_off: relay_maju
      - switch.turn_on: relay_mundur
      - delay: 5min
      - switch.turn_off: relay_mundur
      - globals.set: { id: sudah_balik, value: "true" }

  - id: script_tracker_maju_5menit
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(motor_aktif);"
          then:
            - globals.set: { id: mode_auto, value: "true" }
            - switch.turn_off: relay_mundur
            - switch.turn_on: relay_maju
            - delay: 5min
            - switch.turn_off: relay_maju
            - globals.set: { id: mode_auto, value: "false" }
            - switch.turn_off: sw_tracker_maju_5menit
          else:
            - switch.turn_off: sw_tracker_maju_5menit

  - id: script_tracker_mundur_5menit
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(motor_aktif);"
          then:
            - globals.set: { id: mode_auto, value: "true" }
            - switch.turn_off: relay_maju
            - switch.turn_on: relay_mundur
            - delay: 5min
            - switch.turn_off: relay_mundur
            - globals.set: { id: mode_auto, value: "false" }
            - switch.turn_off: sw_tracker_mundur_5menit
          else:
            - switch.turn_off: sw_tracker_mundur_5menit

  - id: script_tracker_mendatar
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(motor_aktif);"
          then:
            - globals.set: { id: mode_auto, value: "true" }
            - globals.set: { id: sequence_mundur, value: "true" }
            - switch.turn_off: relay_mundur
            - switch.turn_on: relay_maju
            - delay: 5min
            - switch.turn_off: relay_maju
            - switch.turn_on: relay_mundur
            - delay: 150s
            - switch.turn_off: relay_mundur
            - globals.set: { id: mode_auto, value: "false" }
            - globals.set: { id: sequence_mundur, value: "false" }
            - switch.turn_off: sw_tracker_mendatar
          else:
            - switch.turn_off: sw_tracker_mendatar

  - id: script_read_mppt_rx
    mode: restart
    then:
      - delay: 300ms # Jeda aman (non-blocking) membiarkan data terisi di UART HW Buffer
      - lambda: |-
          uint8_t buf[128];
          int buf_len = 0;

          // BACA SECARA INSTAN TANPA LOOP MILLIS (Ini yang membuat hang sebelumnya)
          while (id(mppt_uart).available()) {
            uint8_t rx_byte;
            id(mppt_uart).read_byte(&rx_byte);
            if (buf_len < 128) {
              buf[buf_len++] = rx_byte;
            }
          }

          if (buf_len < 60) return; // Mengabaikan jika data terlalu pendek

          const uint8_t HDR[] = {0x4D, 0x56, 0x4D, 0x50, 0x39};
          int h = -1;
          for (int i = 0; i <= buf_len - 5; i++) {
            if (buf[i]   == HDR[0] && buf[i+1] == HDR[1] &&
                buf[i+2] == HDR[2] && buf[i+3] == HDR[3] &&
                buf[i+4] == HDR[4]) {
              h = i;
              break;
            }
          }

          if (h == -1 || (buf_len - h) < 60) return;
          auto B = [&](int pos) -> uint8_t { return buf[h + pos - 1]; };

          // --- MEMBACA DAN MEMVALIDASI DATA ---
          float pv_v = (float) B(16);
          int bat_cap = (int) B(18);
          float bat_v = (float)(((uint16_t)B(21) << 8) | B(20)) / 10.0f;
          float chg_i = B(24) + (B(60) / 10.0f);
          int mcu_t = (int) B(25);
          int hs_t = (int) B(26);

          uint16_t day_int  = ((uint16_t)B(29) << 8) | B(28);
          uint16_t day_frac = ((uint16_t)B(31) << 8) | B(30);
          float daily_k = day_int + (day_frac / 1000.0f);

          uint16_t tot_int  = ((uint16_t)B(35) << 8) | B(34);
          uint16_t tot_frac = B(33);
          float total_k = tot_int + (tot_frac / 10.0f);

          if (bat_v > 100.0f || pv_v > 200.0f || bat_cap > 100 || mcu_t > 120 || hs_t > 120) {
            ESP_LOGW("MPPT_READ", "Data corrupt terdeteksi dan diabaikan!");
            return;
          }

          // Publish Langsung ke Sensor (Variabel Global MPPT dihapus untuk hemat memori)
          id(sensor_pv_voltage).publish_state(pv_v);
          id(sensor_battery_capacity).publish_state((float)bat_cap);
          id(sensor_battery_voltage).publish_state(bat_v);
          id(sensor_charge_current).publish_state(chg_i);
          id(sensor_pv_power).publish_state(bat_v * chg_i);
          id(sensor_mcu_temp).publish_state((float)mcu_t);
          id(sensor_heatsink_temp).publish_state((float)hs_t);
          id(sensor_daily_kwh).publish_state(daily_k);
          id(sensor_total_kwh).publish_state(total_k);

# ── GLOBAL VARIABLES ──────────────────────────────────────────────────────────
globals:
  # Tersisa hanya yang benar-benar dibutuhkan oleh sistem rotasi & trigger harian
  - id: kwh_kemarin
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: kwh_2hari
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: kwh_3hari
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: kwh_4hari
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: watt_max
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: sun_hour
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: sudah_balik
    type: bool
    restore_value: false
    initial_value: "false"
  - id: motor_aktif
    type: bool
    restore_value: false
    initial_value: "false"
  - id: mode_auto
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sequence_mundur
    type: bool
    restore_value: false
    initial_value: "false"
  - id: menu_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: lcd_aktif
    type: bool
    restore_value: false
    initial_value: "true"

# ── TEXT SENSOR ───────────────────────────────────────────────────────────────
text_sensor:
  - platform: template
    id: tracker_status_text
    name: "PLTS Tracker Status"
    update_interval: 5s
    lambda: |-
      if (id(motor_aktif)) return std::string("Aktif");
      return std::string("Standby");

  - platform: wifi_info
    ip_address:
      name: "IP Address"

  - platform: template
    name: "Huawei Battery Model"
    id: battery_model
    icon: mdi:battery-alert

  - platform: template
    name: "Huawei Battery Module Mode"
    id: battery_module_mode
    icon: mdi:battery-sync

# ── SWITCH ────────────────────────────────────────────────────────────────────
switch:
  - platform: gpio
    pin: GPIO25
    id: de_re_pin
    internal: true

  - platform: gpio
    id: relay_maju
    name: "Relay Maju"
    internal: true
    icon: mdi:arrow-right-bold
    pin:
      number: GPIO19
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    interlock: [relay_mundur]
    interlock_wait_time: 200ms
    on_turn_on:
      - globals.set: { id: motor_aktif, value: "true" }
    on_turn_off:
      - lambda: |-
          if (!id(relay_mundur).state) {
            id(motor_aktif) = false;
            id(mode_auto) = false;
          }

  - platform: gpio
    id: relay_mundur
    name: "Relay Mundur"
    internal: true
    icon: mdi:arrow-left-bold
    pin:
      number: GPIO18
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    interlock: [relay_maju]
    interlock_wait_time: 200ms
    on_turn_on:
      - globals.set: { id: motor_aktif, value: "true" }
    on_turn_off:
      - lambda: |-
          if (!id(relay_maju).state) {
            id(motor_aktif) = false;
            id(mode_auto) = false;
          }

  - platform: template
    name: "Tracker Maju"
    id: sw_tracker_maju
    icon: mdi:arrow-right-bold
    lambda: "return id(relay_maju).state;"
    turn_on_action:
      - switch.turn_on: relay_maju
    turn_off_action:
      - switch.turn_off: relay_maju

  - platform: template
    name: "Tracker Mundur"
    id: sw_tracker_mundur
    icon: mdi:arrow-left-bold
    lambda: "return id(relay_mundur).state;"
    turn_on_action:
      - switch.turn_on: relay_mundur
    turn_off_action:
      - switch.turn_off: relay_mundur

  - platform: template
    name: "Tracker Maju 5 Menit"
    id: sw_tracker_maju_5menit
    icon: mdi:arrow-right-bold-box
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_maju_5menit
    turn_off_action:
      - script.stop: script_tracker_maju_5menit
      - switch.turn_off: relay_maju
      - globals.set: { id: mode_auto, value: "false" }

  - platform: template
    name: "Tracker Mundur 5 Menit"
    id: sw_tracker_mundur_5menit
    icon: mdi:arrow-left-bold-box
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_mundur_5menit
    turn_off_action:
      - script.stop: script_tracker_mundur_5menit
      - switch.turn_off: relay_mundur
      - globals.set: { id: mode_auto, value: "false" }

  - platform: template
    name: "Posisikan PLTS Mendatar"
    id: sw_tracker_mendatar
    icon: mdi:swap-horizontal-bold
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_mendatar
    turn_off_action:
      - script.stop: script_tracker_mendatar
      - switch.turn_off: relay_maju
      - switch.turn_off: relay_mundur
      - globals.set: { id: mode_auto, value: "false" }
      - globals.set: { id: sequence_mundur, value: "false" }

# ── BUTTON ────────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Sync Time to MPPT"
    id: btn_sync_time
    icon: "mdi:clock-check-outline"
    on_press:
      - script.execute: sync_time_to_mppt
  - platform: restart
    id: btn_restart_esp
    name: "Restart ESP"
    icon: mdi:restart
  - platform: template
    name: "Reset PZEM AC Energy"
    id: btn_reset_pzem_energy
    icon: "mdi:lightning-bolt"
    on_press:
      - pzemac.reset_energy: pzem_sensor

# ── INTERVAL ──────────────────────────────────────────────────────────────────
interval:
  - interval: 1000ms
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: animation_strobe_wifi

  - interval: 200ms
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - script.execute: animation_fast_blink

  - interval: 330s
    then:
      - if:
          condition:
            lambda: |-
              auto t = id(sntp_time).now();
              if (!t.is_valid()) return false;
              int h = t.hour;
              return (h >= 10 && h < 16) && !id(motor_aktif);
          then:
            - globals.set: { id: mode_auto, value: "true" }
            - switch.turn_off: relay_mundur
            - switch.turn_on: relay_maju
            - delay: 2400ms
            - switch.turn_off: relay_maju
            - globals.set: { id: mode_auto, value: "false" }

  - interval: 5s
    then:
      - lambda: |-
          uint8_t flush_byte;
          while (id(mppt_uart).available()) id(mppt_uart).read_byte(&flush_byte);

          const uint8_t cmd[] = {0x43, 0x4D, 0x48, 0x42, 0x06, 0x4D, 0x50, 0x50, 0x54, 0x48, 0x42};
          id(de_re_pin).turn_on();
          delay(1);
          id(mppt_uart).write_array(cmd, sizeof(cmd));
          id(mppt_uart).flush();
          id(de_re_pin).turn_off();
      - script.execute: script_read_mppt_rx

  - interval: 5s
    id: rotasi_lcd
    then:
      - lambda: |-
          id(menu_page) = (id(menu_page) + 1) % 7;

# ── OUTPUT & LIGHT CONFIGURATION ──────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO2
    id: led_status_gpio

light:
  - platform: binary
    output: led_status_gpio
    id: led_status

# ── SENSOR ────────────────────────────────────────────────────────────────────
sensor:
  - platform: total_daily_energy
    name: "AC Daily Energy Consumption"
    id: sensor_ac_daily_kwh
    power_id: pzem_power
    unit_of_measurement: "kWh"
    accuracy_decimals: 3
    icon: "mdi:lightning-bolt"
    time_id: sntp_time
    restore: false
    filters:
      - multiply: 0.001

  - platform: pzemac
    id: pzem_sensor
    modbus_id: pzem_modbus
    address: 0x55
    voltage:
      name: "AC Voltage"
      id: pzem_voltage
      filters:
        - lambda: "return std::isnan(x) ? 0.0 : x;"
        - clamp:
            { min_value: 150.0, max_value: 270.0, ignore_out_of_range: true }
    current:
      name: "AC Current"
      id: pzem_current
      filters:
        - lambda: "return std::isnan(x) ? 0.0 : x;"
        - clamp: { min_value: 0.0, max_value: 100.0, ignore_out_of_range: true }
    power:
      name: "AC Power"
      id: pzem_power
      filters:
        - skip_initial: 3
        - lambda: "return std::isnan(x) ? 0.0 : x;"
        - clamp:
            { min_value: 0.0, max_value: 25000.0, ignore_out_of_range: true }
    energy:
      name: "AC Energy"
      id: pzem_energy
      unit_of_measurement: "kWh"
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
    frequency:
      name: "AC Frequency"
      id: pzem_frequency
      filters:
        - lambda: "return std::isnan(x) ? 0.0 : x;"
    power_factor:
      name: "AC Power Factor"
      id: pzem_pf
      icon: mdi:math-cos
      filters:
        - lambda: "return std::isnan(x) ? 0.0 : x;"
    update_interval: 2s

  # --- MPPT SENSORS ---
  - platform: template
    name: "MPPT PV Voltage"
    id: sensor_pv_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "MPPT Battery Capacity"
    id: sensor_battery_capacity
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:battery"

  - platform: template
    name: "MPPT Battery Voltage"
    id: sensor_battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "MPPT Charge Current"
    id: sensor_charge_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: "MPPT PV Power"
    id: sensor_pv_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    lambda: |
      if (id(sensor_pv_power).state > id(watt_max)) {
        id(watt_max) = id(sensor_pv_power).state;
      }
      return id(sensor_pv_power).state;

  - platform: template
    name: "MPPT MCU Temperature"
    id: sensor_mcu_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "MPPT Heatsink Temperature"
    id: sensor_heatsink_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: "MPPT Daily Energy"
    id: sensor_daily_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: template
    name: "MPPT Total Energy"
    id: sensor_total_kwh
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1

  - platform: template
    id: peak_sun_hour
    name: "MPPT Peak Sun Hour"
    icon: mdi:weather-sunny
    unit_of_measurement: "jam"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      id(sun_hour) = id(sensor_daily_kwh).state / 0.5;
      return id(sun_hour);

  - platform: template
    id: watt_maximum
    name: "MPPT Daya Maksimum"
    icon: mdi:lightning-bolt-circle
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0
