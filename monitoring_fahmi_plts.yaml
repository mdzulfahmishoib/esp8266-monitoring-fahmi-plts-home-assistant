    id: hw_battery_accumulated_cycles
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sync
    update_interval: 10s
    lambda: |-
      float cap = id(hw_battery_capacity).state;
      if (std::isnan(cap) || cap <= 0.0f) cap = 100.0f;
      float ah = id(hw_battery_discharge_ah).state;
      if (std::isnan(ah)) return NAN;
      return round(ah / (cap * 0.74f));

# ── DISPLAY ───────────────────────────────────────────────────────────────────
display:
  - platform: lcd_pcf8574
    id: lcd_display
    dimensions: 16x2
    address: 0x27
    update_interval: 1s
    lambda: |-
      if (!id(lcd_aktif)) { 
        it.no_backlight(); 
        return; 
      }
      it.backlight();
      int page = id(menu_page);
      char buf[17];

      auto get_val = [](float val) -> float { return std::isnan(val) ? 0.0f : val; };

      // Pembacaan Nilai Sensor (Menggunakan Sensor ID, Global dihapus)
      float v_bat_mppt = get_val(id(sensor_battery_voltage).state);
      float i_chg_mppt = get_val(id(sensor_charge_current).state);
      float p_pv_mppt  = get_val(id(sensor_pv_power).state);
      float kwh_daily  = get_val(id(sensor_daily_kwh).state);
      float w_max      = get_val(id(watt_max));
      float s_hour     = get_val(id(sun_hour));
      float v_ac       = get_val(id(pzem_voltage).state);
      float i_ac       = get_val(id(pzem_current).state);
      float p_ac       = get_val(id(pzem_power).state);
      float freq       = get_val(id(pzem_frequency).state);
      float pf         = get_val(id(pzem_pf).state);

      float kwh_1 = get_val(id(kwh_kemarin));
      float kwh_2 = get_val(id(kwh_2hari));
      float kwh_3 = get_val(id(kwh_3hari));
      float kwh_4 = get_val(id(kwh_4hari));

      switch (page) {
        case 0:
          it.printf(0, 0, "%.2fV  ", v_bat_mppt);
          it.printf(8, 0, "%.2fA  ", i_chg_mppt);
          it.printf(0, 1, "%.1fW  ", p_pv_mppt);
          it.printf(8, 1, "%.3fkWh", kwh_daily);
          break;

        case 1:
          it.print(0, 0, "Wp Max: ");
          it.print(8, 0, " Psh:");
          it.printf(0, 1, "%.2fW ", w_max);
          it.printf(9, 1, "%.2fJ ", s_hour);
          break;

        case 2:
          snprintf(buf, sizeof(buf), "D1:%.2f D2:%.2f", kwh_1, kwh_2);
          it.print(0, 0, buf);
          snprintf(buf, sizeof(buf), "D3:%.2f D4:%.2f", kwh_3, kwh_4);
          it.print(0, 1, buf);
          break;

        case 3:
          it.printf(0, 0, "%.1fV ", v_ac);
          it.printf(8, 0, "%.2fA ", i_ac);
          it.printf(0, 1, "%.1fW ", p_ac);
          it.printf(8, 1, "%.3fkWh", get_val(id(sensor_ac_daily_kwh).state));
          break;

        case 4:
          it.print(0, 0, "Freq: ");
          it.print(8, 0, " PF: ");
          it.printf(0, 1, "%.0fHz ", freq);
          it.printf(9, 1, "%.2f ", pf);
          break;

        case 5:
          it.printf(0, 0, "Relay:%s", id(motor_aktif) ? "Aktif  " : "Mati   ");
          it.printf(0, 1, "Tracker:%-7s", id(tracker_status_text).state.c_str());
          break;

        case 6:
          {
            it.print(1, 0, "Waktu Sekarang");
            auto t = id(sntp_time).now();
            if (t.is_valid()) {
              it.strftime(4, 1, "%H:%M:%S", t);
            } else {
              it.print(4, 1, "--:--:--");
            }
          }
          break;
      }
