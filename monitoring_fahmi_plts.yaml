  # --- CUSTOM SENSOR READERS (Untuk Data Kompleks) ---
  - platform: modbus_controller
    modbus_controller_id: huawei_controller
    id: hw_battery_module_mode_raw
    internal: true
    address: 0x000E
    register_type: holding
    value_type: U_WORD
    on_value:
      - then:
          - lambda: |-
              std::string mode_text;
              switch ((int)x) {
                case 0: mode_text = "Hibernating"; break;
                case 1: mode_text = "Low Power"; break;
                case 2: mode_text = "Charging"; break;
                case 3: mode_text = "Discharging"; break;
                case 4: mode_text = "Standby"; break;
                default: mode_text = "Unknown"; break;
              }
              id(battery_module_mode).publish_state(mode_text);

  - platform: modbus_controller
    modbus_controller_id: huawei_controller
    id: hw_battery_cell_reader
    internal: true
    address: 0x0022
    register_type: holding
    register_count: 16
    lambda: |-
      float min_voltage = 999.0f;
      float max_voltage = -999.0f;
      for (int i = 0; i < 16; i++) {
        uint16_t raw = (data[i*2] << 8) | data[i*2+1];
        if (raw != 0xFFFF) {
          float v = raw * 0.001f;
          if (v > 0.0f) {
            if (v < min_voltage) min_voltage = v;
            if (v > max_voltage) max_voltage = v;
          }
        }
      }
      if (max_voltage >= min_voltage) {
        id(hw_battery_min_cell_voltage).publish_state(min_voltage);
        id(hw_battery_max_cell_voltage).publish_state(max_voltage);
        id(hw_battery_cell_voltage_difference).publish_state((max_voltage - min_voltage) * 1000.0f);
      }
      return 0;

  - platform: modbus_controller
    modbus_controller_id: huawei_controller
    id: hw_battery_model_reader
    internal: true
    address: 0x0332
    register_type: holding
    register_count: 6
    lambda: |-
      std::string result;
      for (int i = 0; i < 6; i++) {
        uint16_t raw = (data[i*2] << 8) | data[i*2+1];
        if (raw == 0xFFFF) break;
        uint8_t high = (raw >> 8) & 0xFF;
        uint8_t low = raw & 0xFF;
        if (high >= 0x20 && high <= 0x7E) result += (char)high;
        if (low >= 0x20 && low <= 0x7E) result += (char)low;
      }
      id(battery_model).publish_state(result);
      return 0;

