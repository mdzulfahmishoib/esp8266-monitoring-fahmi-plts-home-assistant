# ============================================================
#  TEXT SENSOR
# ============================================================
text_sensor:
  - platform: template
    id: tracker_status_text
    name: "PLTS Tracker Status"
    update_interval: 5s
    lambda: |-
      if (id(motor_aktif)) {
        return std::string("Aktif");
      }
      return std::string("Standby");

  - platform: wifi_info
    ip_address:
      name: "IP Address"

  # Huawei Battery Text Sensors
  - platform: template
    name: "Huawei Battery Model"
    id: battery_model
    icon: mdi:battery-alert
    update_interval: never

  - platform: template
    name: "Huawei Battery Module Mode"
    id: battery_module_mode
    icon: mdi:battery-sync
    update_interval: never

# ============================================================
#  SWITCH (Relay Kontrol Motor & Pin DE/RE RS485 MPPT)
# ============================================================
switch:
  - platform: gpio
    pin: GPIO25
    id: de_re_pin
    internal: true

  - platform: gpio
    id: relay_maju
    name: "Relay Maju"
    internal: true
    icon: mdi:arrow-right-bold
    pin:
      number: GPIO19
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    interlock: [relay_mundur] # Interlock: tidak bisa aktif bersamaan
    interlock_wait_time: 200ms
    on_turn_on:
      - globals.set:
          id: motor_aktif
          value: "true"
    on_turn_off:
      - lambda: |-
          if (!id(relay_mundur).state) {
            id(motor_aktif) = false;
            id(mode_auto) = false;
          }

  - platform: gpio
    id: relay_mundur
    name: "Relay Mundur"
    internal: true
    icon: mdi:arrow-left-bold
    pin:
      number: GPIO18
      mode: OUTPUT
    restore_mode: ALWAYS_OFF
    interlock: [relay_maju]
    interlock_wait_time: 200ms
    on_turn_on:
      - globals.set:
          id: motor_aktif
          value: "true"
    on_turn_off:
      - lambda: |-
          if (!id(relay_maju).state) {
            id(motor_aktif) = false;
            id(mode_auto) = false;
          }

  - platform: template
    name: "Tracker Maju"
    id: sw_tracker_maju
    icon: mdi:arrow-right-bold
    lambda: |-
      return id(relay_maju).state;
    turn_on_action:
      - switch.turn_on: relay_maju
    turn_off_action:
      - switch.turn_off: relay_maju

  - platform: template
    name: "Tracker Mundur"
    id: sw_tracker_mundur
    icon: mdi:arrow-left-bold
    lambda: |-
      return id(relay_mundur).state;
    turn_on_action:
      - switch.turn_on: relay_mundur
    turn_off_action:
      - switch.turn_off: relay_mundur

  - platform: template
    name: "Tracker Maju 5 Menit"
    id: sw_tracker_maju_5menit
    icon: mdi:arrow-right-bold-box
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_maju_5menit
    turn_off_action:
      - script.stop: script_tracker_maju_5menit
      - switch.turn_off: relay_maju
      - globals.set: { id: mode_auto, value: "false" }

  - platform: template
    name: "Tracker Mundur 5 Menit"
    id: sw_tracker_mundur_5menit
    icon: mdi:arrow-left-bold-box
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_mundur_5menit
    turn_off_action:
      - script.stop: script_tracker_mundur_5menit
      - switch.turn_off: relay_mundur
      - globals.set: { id: mode_auto, value: "false" }

  - platform: template
    name: "Posisikan PLTS Mendatar"
    id: sw_tracker_mendatar
    icon: mdi:swap-horizontal-bold
    optimistic: true
    turn_on_action:
      - script.execute: script_tracker_mendatar
    turn_off_action:
      - script.stop: script_tracker_mendatar
      - switch.turn_off: relay_maju
      - switch.turn_off: relay_mundur
      - globals.set: { id: mode_auto, value: "false" }
      - globals.set: { id: sequence_mundur, value: "false" }

# ── BUTTON ────────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Sync Time to MPPT"
    id: btn_sync_time
    icon: "mdi:clock-check-outline"
    on_press:
      - script.execute: sync_time_to_mppt

  - platform: restart
    id: btn_restart_esp
    name: "Restart ESP"
    icon: mdi:restart

# ── INTERVAL ──────────────────────────────────────────────────────────────────
interval:
  - interval: 330s
    then:
      - if:
          condition:
            lambda: |-
              auto t = id(sntp_time).now();
              if (!t.is_valid()) return false;
              int h = t.hour;
              return (h >= 10 && h < 16) && !id(motor_aktif);
          then:
            - globals.set:
                id: mode_auto
                value: "true"
            - switch.turn_off: relay_mundur
            - switch.turn_on: relay_maju
            - delay: 1200ms
            - switch.turn_off: relay_maju
            - globals.set:
                id: mode_auto
                value: "false"
            - logger.log: "Tracker: Gerak Otomatis 1.2 detik"

  - interval: 5s
    then:
      - lambda: |-
          uint8_t flush_byte;
          while (id(mppt_uart).available()) id(mppt_uart).read_byte(&flush_byte);

          const uint8_t cmd[] = {
            0x43, 0x4D, 0x48, 0x42, 0x06,
            0x4D, 0x50, 0x50, 0x54, 0x48, 0x42
          };

          // SET HIGH DE/RE UNTUK TRANSMIT
          id(de_re_pin).turn_on();
          delay(1);
          id(mppt_uart).write_array(cmd, sizeof(cmd));
          id(mppt_uart).flush();
          // RETURN LOW UNTUK RECEIVE
          id(de_re_pin).turn_off();

      - delay: 300ms

      - lambda: |-
          uint8_t buf[128];
          int buf_len = 0;
          unsigned long t_start = millis();
          while (millis() - t_start < 500 && buf_len < 128) {
            if (id(mppt_uart).available()) {
              uint8_t rx_byte;
              id(mppt_uart).read_byte(&rx_byte);
              buf[buf_len++] = rx_byte;
            } else {
              yield();
            }
          }

          if (buf_len == 0) return;

          const uint8_t HDR[] = {0x4D, 0x56, 0x4D, 0x50, 0x39};
          int h = -1;
          for (int i = 0; i <= buf_len - 5; i++) {
            if (buf[i]   == HDR[0] && buf[i+1] == HDR[1] &&
                buf[i+2] == HDR[2] && buf[i+3] == HDR[3] &&
                buf[i+4] == HDR[4]) {
              h = i;
              break;
            }
          }

          if (h == -1 || buf_len - h < 60) return;

          auto B = [&](int pos) -> uint8_t { return buf[h + pos - 1]; };

          id(g_pv_voltage) = (float) B(16);
          id(g_battery_capacity) = (int) B(18);
          id(g_battery_voltage) = (float)(((uint16_t)B(21) << 8) | B(20)) / 10.0f;
          id(g_charge_current) = B(24) + (B(60) / 10.0f);
          id(g_pv_power) = id(g_battery_voltage) * id(g_charge_current);
          id(g_mcu_temp) = (int) B(25);
          id(g_heatsink_temp) = (int) B(26);

          uint16_t day_int  = ((uint16_t)B(29) << 8) | B(28); // Disesuaikan posisi byte day_int
          uint16_t day_frac = ((uint16_t)B(31) << 8) | B(30);
          id(g_daily_kwh) = day_int + (day_frac / 1000.0f);

          uint16_t tot_int  = ((uint16_t)B(35) << 8) | B(34);
          uint16_t tot_frac = B(33);
          id(g_total_kwh) = tot_int + (tot_frac / 10.0f);

          id(sensor_pv_voltage).publish_state(id(g_pv_voltage));
          id(sensor_battery_capacity).publish_state((float)id(g_battery_capacity));
          id(sensor_battery_voltage).publish_state(id(g_battery_voltage));
          id(sensor_charge_current).publish_state(id(g_charge_current));
          id(sensor_pv_power).publish_state(id(g_pv_power));
          id(sensor_mcu_temp).publish_state((float)id(g_mcu_temp));
          id(sensor_heatsink_temp).publish_state((float)id(g_heatsink_temp));
          id(sensor_daily_kwh).publish_state(id(g_daily_kwh));
          id(sensor_total_kwh).publish_state(id(g_total_kwh));

  - interval: 5s
    id: rotasi_lcd
    then:
      - lambda: |-
          id(menu_page) = (id(menu_page) + 1) % 7;

  # Huawei RS485 Battery Polling Interval
  - interval: 5s
    then:
      - lambda: |-
          const uint8_t SLAVE_ADDRESS = 214;
          const uint16_t MODBUS_TIMEOUT_MS = 500;

          auto modbus_crc16 = [](const uint8_t *buffer, int length) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (int pos = 0; pos < length; pos++) {
              crc ^= buffer[pos];
              for (int i = 0; i < 8; i++) {
                if (crc & 0x0001) {
                  crc >>= 1;
                  crc ^= 0xA001;
                } else {
                  crc >>= 1;
                }
              }
            }
            return crc;
          };

          auto read_registers = [&](uint16_t start_address, uint16_t number_of_registers, uint16_t *output) -> bool {
            if (number_of_registers == 0 || number_of_registers > 32) return false;

            uint8_t request[8];
            request[0] = SLAVE_ADDRESS;
            request[1] = 0x03;
            request[2] = (start_address >> 8) & 0xFF;
            request[3] = start_address & 0xFF;
            request[4] = (number_of_registers >> 8) & 0xFF;
            request[5] = number_of_registers & 0xFF;

            uint16_t crc = modbus_crc16(request, 6);
            request[6] = crc & 0xFF;
            request[7] = (crc >> 8) & 0xFF;

            while (id(huawei_uart)->available()) {
              uint8_t dummy;
              id(huawei_uart)->read_byte(&dummy);
            }

            id(huawei_uart)->write_array(request, 8);
            id(huawei_uart)->flush();

            uint8_t response[256];
            int index = 0;
            uint32_t start_time = millis();
            uint32_t last_byte_time = millis();

            while (millis() - start_time < MODBUS_TIMEOUT_MS) {
              if (id(huawei_uart)->available()) {
                uint8_t byte;
                if (id(huawei_uart)->read_byte(&byte)) {
                  if (index < 256) response[index++] = byte;
                  last_byte_time = millis();
                }
              } else {
                if (index >= 5 && millis() - last_byte_time > 20) break;
                delay(1);
              }
            }

            if (index < 5 || response[0] != SLAVE_ADDRESS || response[1] != 0x03) return false;

            uint8_t byte_count = response[2];
            if (byte_count != number_of_registers * 2) return false;

            int expected_length = 3 + byte_count + 2;
            if (index < expected_length) return false;

            uint16_t received_crc = response[expected_length - 2] | (response[expected_length - 1] << 8);
            uint16_t calculated_crc = modbus_crc16(response, expected_length - 2);
            if (received_crc != calculated_crc) return false;

            for (int i = 0; i < number_of_registers; i++) {
              output[i] = ((uint16_t) response[3 + i * 2] << 8) | response[3 + i * 2 + 1];
            }
            return true;
          };

          auto decode_ascii = [](uint16_t *regs, int count) -> std::string {
            std::string result;
            for (int i = 0; i < count; i++) {
              if (regs[i] == 0xFFFF) break;
              uint8_t high = (regs[i] >> 8) & 0xFF;
              uint8_t low = regs[i] & 0xFF;
              if (high >= 0x20 && high <= 0x7E) result += (char) high;
              if (low >= 0x20 && low <= 0x7E) result += (char) low;
            }
            return result;
          };

          uint16_t regs[32];
          bool all_ok = true;

          // BLOCK 1
          if (read_registers(0x0000, 15, regs)) {
            id(busbar_voltage_value) = regs[0] * 0.01f;
            id(battery_voltage_value) = regs[1] * 0.01f;
            id(battery_current_value) = ((int16_t) regs[2]) * 0.01f;
            id(soc_value) = regs[3];
            id(soh_value) = regs[4];
            id(max_cell_temp_value) = (int16_t) regs[5];
            id(min_cell_temp_value) = (int16_t) regs[6];
            id(module_mode_value) = regs[14];
          } else { all_ok = false; }
          delay(30);

          // BLOCK 2
          if (read_registers(0x0012, 16, regs)) {
            // Processed directly if needed
          } else { all_ok = false; }
          delay(30);

          // BLOCK 3 (CELL VOLTAGE SUMMARY)
          if (read_registers(0x0022, 16, regs)) {
            float min_voltage = 999.0f;
            float max_voltage = -999.0f;
            for (int i = 0; i < 16; i++) {
              if (regs[i] != 0xFFFF) {
                float v = regs[i] * 0.001f;
                if (v > 0.0f) {
                  if (v < min_voltage) min_voltage = v;
                  if (v > max_voltage) max_voltage = v;
                }
              }
            }
            if (max_voltage >= min_voltage) {
              id(min_cell_voltage_value) = min_voltage;
              id(max_cell_voltage_value) = max_voltage;
              id(diff_cell_voltage_value) = (max_voltage - min_voltage) * 1000.0f;
            }
          } else { all_ok = false; }
          delay(30);

          // BLOCK 4
          if (read_registers(0x0042, 9, regs)) {
            id(discharge_times_value) = ((uint32_t) regs[0] << 16) | regs[1];
            id(discharge_ah_value) = ((uint32_t) regs[2] << 16) | regs[3];
          } else { all_ok = false; }
          delay(30);

          // BLOCK 5
          if (read_registers(0x0101, 15, regs)) {
            id(manufacturer_value) = regs[4];
            id(software_id_value) = regs[5];
            id(battery_capacity_value) = regs[6];
          } else { all_ok = false; }
          delay(30);

          // BLOCK 6
          if (read_registers(0x0204, 7, regs)) {
            id(output_power_value) = regs[0];
            id(external_busbar_voltage_value) = regs[1] * 0.01f;
            id(runtime_hour_value) = ((uint32_t) regs[5] << 16) | regs[6];
          } else { all_ok = false; }
          delay(30);

          // BLOCK 8
          if (read_registers(0x0332, 18, regs)) {
            id(battery_model_value) = decode_ascii(regs, 12);
            id(discharge_wh_value) = ((uint32_t) regs[16] << 16) | regs[17];
          } else { all_ok = false; }

          // ACCUMULATED CYCLE
          float nominal_capacity = id(battery_capacity_value) > 0 ? (float) id(battery_capacity_value) : 100.0f;
          const float efficiency_factor = 0.74f;
          id(accumulated_cycles_value) = (uint16_t) round((float) id(discharge_ah_value) / (nominal_capacity * efficiency_factor));

          // PUBLISH BASIC DATA
          id(hw_battery_voltage)->publish_state(id(battery_voltage_value));
          id(hw_battery_current)->publish_state(id(battery_current_value));
          id(hw_battery_power)->publish_state(id(battery_voltage_value) * id(battery_current_value));
          id(hw_battery_soc)->publish_state(id(soc_value));
          id(hw_battery_soh)->publish_state(id(soh_value));
          id(hw_battery_busbar_voltage)->publish_state(id(busbar_voltage_value));

          // CELL SUMMARY
          id(hw_battery_min_cell_voltage)->publish_state(id(min_cell_voltage_value));
          id(hw_battery_max_cell_voltage)->publish_state(id(max_cell_voltage_value));
          id(hw_battery_cell_voltage_difference)->publish_state(id(diff_cell_voltage_value));
          id(hw_battery_max_cell_temperature)->publish_state(id(max_cell_temp_value));
          id(hw_battery_min_cell_temperature)->publish_state(id(min_cell_temp_value));

          // DISCHARGE
          id(hw_battery_discharge_ah)->publish_state(id(discharge_ah_value));
          id(hw_battery_discharge_wh)->publish_state(id(discharge_wh_value));
          id(hw_battery_discharge_times)->publish_state(id(discharge_times_value));
          id(hw_battery_runtime)->publish_state(id(runtime_hour_value));
          id(hw_battery_accumulated_cycles)->publish_state(id(accumulated_cycles_value));

          // BATTERY INFORMATION
          id(hw_battery_capacity)->publish_state(id(battery_capacity_value));
          id(hw_battery_output_power)->publish_state(id(output_power_value));
          id(hw_battery_external_busbar_voltage)->publish_state(id(external_busbar_voltage_value));

          // TEXT SENSORS
          id(battery_model)->publish_state(id(battery_model_value));

          std::string mode_text;
          switch (id(module_mode_value)) {
            case 0: mode_text = "Hibernating"; break;
            case 1: mode_text = "Low Power"; break;
            case 2: mode_text = "Charging"; break;
            case 3: mode_text = "Discharging"; break;
            case 4: mode_text = "Standby"; break;
            default: mode_text = "Unknown"; break;
          }
          id(battery_module_mode)->publish_state(mode_text);

          ESP_LOGI("huawei", "Battery | V=%.2f V | I=%.2f A | SOC=%u %% | SOH=%u %% | Cycles=%u",
                   id(battery_voltage_value), id(battery_current_value), id(soc_value), id(soh_value), id(accumulated_cycles_value));

